<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Otentikasi - ber.kesaan</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    .login-container {
      max-width: 500px;
      margin: 0 auto;
      background: var(--bg-color);
      padding: 4rem;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.05);
      text-align: center;
    }
    .toggle-text {
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: var(--text-light);
    }
    .toggle-link {
      color: var(--primary-color);
      cursor: pointer;
      font-weight: 600;
      text-decoration: underline;
    }
    #registerForm {
      display: none;
    }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="logo">BER.KESAAN.</a>
    <ul class="nav-links">
      <li><a href="/">Beranda</a></li>
      <li><a href="/portfolio.html">Portofolio</a></li>
      <li><a href="/booking.html">Booking</a></li>
      <li><a href="/client-login.html">Client Area</a></li>
    </ul>
  </nav>

  <div class="page-header">
    <h1 class="fade-up" id="authTitle">Masuk ke Akun Anda</h1>
  </div>

  <section class="booking-section" style="padding-top: 0; min-height: 50vh;">
    <div class="login-container fade-up" style="transition-delay: 0.2s">
      
      <!-- LOGIN FORM -->
      <form id="loginForm">
        <div class="form-group">
          <input type="email" id="loginEmail" class="form-control" placeholder="Alamat Email" required>
        </div>
        <div class="form-group">
          <input type="password" id="loginPassword" class="form-control" placeholder="Kata Sandi" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Masuk</button>
        <p class="toggle-text">Belum punya akun? <span class="toggle-link" onclick="toggleAuth('register')">Daftar sekarang</span></p>
      </form>

      <!-- REGISTER FORM -->
      <form id="registerForm">
        <div class="form-group">
          <input type="text" id="registerName" class="form-control" placeholder="Nama Lengkap" required>
        </div>
        <div class="form-group">
          <input type="email" id="registerEmail" class="form-control" placeholder="Alamat Email" required>
        </div>
        <div class="form-group">
          <input type="password" id="registerPassword" class="form-control" placeholder="Kata Sandi (Min 6 Karakter)" required minlength="6">
        </div>
        <button type="submit" class="btn" style="width: 100%;">Daftar</button>
        <p class="toggle-text">Sudah punya akun? <span class="toggle-link" onclick="toggleAuth('login')">Masuk di sini</span></p>
      </form>
      
    </div>
  </section>

  <footer>
    <div class="footer-content">
      <h3>BER.KESAAN.</h3>
      <p>Premium Prewedding Photography Studio</p>
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script type="module" src="./firebase-config.js"></script>
  <script type="module" src="./main.js"></script>
  <script type="module" src="./auth.js"></script>
  
  <script>
    function toggleAuth(type) {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const title = document.getElementById('authTitle');

      if(type === 'register') {
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
        title.textContent = 'Buat Akun Baru';
      } else {
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
        title.textContent = 'Masuk ke Akun Anda';
      }
    }
  </script>
</body>
</html>
