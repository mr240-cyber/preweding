<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking - ber.kesaan</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <nav>
    <a href="/" class="logo">BER.KESAAN.</a>
    <ul class="nav-links">
      <li><a href="/">Beranda</a></li>
      <li><a href="/portfolio.html">Portofolio</a></li>
      <li><a href="/booking.html" class="active">Booking</a></li>
      <li><a href="/client-login.html">Client Area</a></li>
    </ul>
  </nav>

  <div class="page-header">
    <h1 class="fade-up">Mulai Perjalanan Anda</h1>
    <p class="fade-up" style="transition-delay: 0.2s; color: var(--text-light);">Isi formulir di bawah ini untuk berkonsultasi mengenai sesi prewedding impian Anda.</p>
  </div>

  <section class="booking-section" style="padding-top: 0;">
    <div class="booking-container fade-up" style="transition-delay: 0.3s">
      <form id="bookingForm">
        <div class="form-group">
          <label for="name">Nama Lengkap Pasangan</label>
          <input type="text" id="name" class="form-control" placeholder="Contoh: Romeo & Juliet" required>
        </div>
        
        <div class="form-group">
          <label for="email">Alamat Email</label>
          <input type="email" id="email" class="form-control" placeholder="email@contoh.com" required>
        </div>

        <div class="form-group">
          <label for="phone">Nomor Telepon / WhatsApp</label>
          <input type="tel" id="phone" class="form-control" placeholder="081234567890" required>
        </div>

        <div class="form-group">
          <label for="date">Perkiraan Tanggal Pemotretan</label>
          <input type="date" id="date" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="location">Konsep / Lokasi Impian (Opsional)</label>
          <input type="text" id="location" class="form-control" placeholder="Contoh: Pantai, Pegunungan, atau Studio">
        </div>

        <div class="form-group fade-up" style="transition-delay: 0.4s">
          <label for="package">Paket Prewedding</label>
          <select id="package" name="package" class="form-control" required>
            <option value="">Pilih Paket...</option>
            <!-- Dynamic packages injected here -->
          </select>
        </div>

        <div class="form-group">
          <label for="message">Pesan Tambahan</label>
          <textarea id="message" class="form-control" placeholder="Ceritakan sedikit tentang kisah cinta atau ekspektasi Anda..."></textarea>
        </div>

        <button type="submit" class="btn">Kirim Permintaan Booking</button>
      </form>
    </div>
  </section>

  <footer>
    <div class="footer-content">
      <h3>BER.KESAAN.</h3>
      <p>Premium Prewedding Photography Studio</p>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 ber.kesaan Photography. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script type="module" src="./firebase-config.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
